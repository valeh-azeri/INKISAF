name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "clients/OzunuInkisaf.Maui/**"
      - "src/OzunuInkisaf.Contracts/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.404"

      - name: Install Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Build APK
        run: dotnet build clients/OzunuInkisaf.Maui/OzunuInkisaf.Maui.csproj -f net8.0-android -c Release

      - name: Find APK
        id: find_apk
        run: |
          apk=$(find clients/OzunuInkisaf.Maui/bin/Release/net8.0-android -iname "*-Signed.apk" | head -1)
          if [ -z "$apk" ]; then
            apk=$(find clients/OzunuInkisaf.Maui/bin/Release/net8.0-android -iname "*.apk" | head -1)
          fi
          cp "$apk" OzunuInkisaf.apk
          echo "path=OzunuInkisaf.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: OzunuInkisaf-android
          path: OzunuInkisaf.apk

      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-android
          name: "Android APK (avtomatik, ən son)"
          body: "Bu, `main` branch-inə hər push-da avtomatik yenilənən Android APK-dır. Telefonunuzda bu linkdən yükləyib quraşdıra bilərsiniz."
          files: OzunuInkisaf.apk
          prerelease: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
